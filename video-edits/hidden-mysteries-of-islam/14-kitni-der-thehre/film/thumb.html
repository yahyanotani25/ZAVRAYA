<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;overflow:hidden}
#root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#020203;color:#fff}
.abs{position:absolute}
canvas{position:absolute;left:0;top:0}
</style></head><body><div id="root"></div>
<script type="module">
// Thumbnail for "Kitni Der Thehre?" — 1920x1080 master (exported at 1280x720): cave mouth, the silver coin in the
// light, the question in Arabic (machine-copied from quran.js) and the number the video sells: 1 GHANTA 41 MINUTE.
import { THREE, rng } from '/src/engine.js';
import { coin, blob, dunes } from '/src/lib14.js';
import { Q } from '/src/quran.js';
const root = document.getElementById('root'), W = 1920, H = 1080;
const add = (html) => { const d = document.createElement('div'); d.innerHTML = html; const out = [...d.children]; while (d.firstChild) root.appendChild(d.firstChild); return out; };
const CX = 560, CY = 520;                       // centre of the cave mouth / the coin

// 1 — the world outside the cave: low sun, dunes
add(`<div class="abs" style="inset:0;background:linear-gradient(180deg,#f6d79a 0%,#ffe6b0 30%,#fff3cf 47%,#f7b65c 62%,#b85a22 78%,#3a1608 100%)"></div>
<div class="abs" style="left:${CX - 430}px;top:${CY - 470}px;width:860px;height:860px;border-radius:50%;background:radial-gradient(circle,#ffffff 0%,#fff8dc 22%,rgba(255,236,170,.75) 42%,rgba(255,214,130,0) 70%)"></div>
<svg class="abs" style="inset:0" width="1920" height="1080" viewBox="0 0 1920 1080">
  <path d="${dunes(3, 742, 34)}" fill="#a85a26"/><path d="${dunes(6, 838, 30)}" fill="#5a2a12"/>
</svg>`);

// 2 — cave walls: jagged rock, a lit far ring and the black near wall
function rock(seed, cx, cy, rx, ry, rough, n = 150) {
  const R = rng(seed), ph = [R() * 6, R() * 6, R() * 6, R() * 6]; let d = '';
  for (let i = 0; i < n; i++) { const a = i / n * 6.2832;
    const k = 1 + rough * (Math.sin(a * 2 + ph[0]) * 0.42 + Math.sin(a * 5 + ph[1]) * 0.26 + Math.sin(a * 11 + ph[2]) * 0.14 + Math.sin(a * 23 + ph[3]) * 0.07) + (R() - 0.5) * rough * 0.22;
    d += `${i ? 'L' : 'M'} ${(cx + Math.cos(a) * rx * k).toFixed(1)} ${(cy + Math.sin(a) * ry * k).toFixed(1)} `; }
  return d + 'Z';
}
const farHole = rock(5, CX, CY - 6, 455, 400, 0.24), nearHole = rock(11, CX + 26, CY + 4, 600, 520, 0.2);
const FULL = 'M -100 -100 L 2020 -100 L 2020 1180 L -100 1180 Z ';
add(`<svg class="abs" style="inset:0" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="rock" gradientUnits="userSpaceOnUse" cx="${CX}" cy="${CY}" r="820"><stop offset="0.5" stop-color="#b0683a"/><stop offset="0.66" stop-color="#5a2c14"/><stop offset="0.84" stop-color="#1c0c05"/><stop offset="1" stop-color="#060302"/></radialGradient>
    <filter id="stone" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.017" numOctaves="5" seed="7" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="26" diffuseConstant="1.15" lighting-color="#ffffff" result="l"><feDistantLight azimuth="205" elevation="34"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceGraphic" operator="in" result="lit"/>
      <feBlend in="SourceGraphic" in2="lit" mode="multiply"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="ringClip"><path d="${nearHole}"/></clipPath>
  </defs>
  <g clip-path="url(#ringClip)"><path d="${FULL}${farHole}" fill="url(#rock)" fill-rule="evenodd" filter="url(#stone)"/></g>
  <path d="${farHole}" fill="none" stroke="rgba(255,226,160,.55)" stroke-width="20" filter="url(#soft)"/>
  <path d="${farHole}" fill="none" stroke="rgba(255,240,200,.6)" stroke-width="3" filter="url(#soft2)"/>
  <path d="${FULL}${nearHole}" fill="#030201" fill-rule="evenodd"/>
  <path d="${nearHole}" fill="none" stroke="rgba(0,0,0,.9)" stroke-width="40" filter="url(#soft)"/>
</svg>`);

// 3 — shafts of light falling into the cave, toward the text side
const rays = [[-13, 0.26, 230], [-4, 0.2, 170], [6, 0.24, 260], [15, 0.16, 150], [-24, 0.14, 140], [26, 0.12, 190]];
add(rays.map(([a, o, w]) => `<div class="abs" style="left:${CX}px;top:${CY - w / 2}px;width:1700px;height:${w}px;transform-origin:0% 50%;transform:rotate(${a}deg);background:linear-gradient(90deg,rgba(255,222,160,${o}) 0%,rgba(255,214,150,${o * 0.55}) 34%,rgba(255,214,150,0) 86%);clip-path:polygon(0 42%,100% 0,100% 100%,0 58%);filter:blur(16px);mix-blend-mode:screen"></div>`).join(''));

// 4 — the coin (3D), back-lit by the sun, a cool key from the cave side
const cv = document.createElement('canvas'); cv.width = W; cv.height = H; root.appendChild(cv);
const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
ren.setPixelRatio(1); ren.setSize(W, H, false); ren.outputColorSpace = THREE.SRGBColorSpace; ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.0;
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
cam.position.set(0, 0, 5.7); cam.lookAt(0, 0, 0);
const c = coin({ bump: 10, tint: 0xcfd4de }); scene.add(c);
const hpx = 2 * Math.tan(15 * Math.PI / 180) * 5.7 / H;        // world units per pixel at z = 0
c.position.set((CX - W / 2) * hpx, -(CY + 6 - H / 2) * hpx, 0); c.scale.setScalar(0.9); c.rotation.set(-0.26, 0.5, 0.1);
scene.add(new THREE.AmbientLight(0x2a3246, 0.95));
const key = new THREE.DirectionalLight(0xfff4e4, 0.85); key.position.set(2.6, 2.4, 4.4); key.target = c; scene.add(key);
const spot = new THREE.PointLight(0xffffff, 15, 30); spot.position.set(c.position.x + 1.25, c.position.y + 1.15, 1.25); scene.add(spot);      // near light: a falloff across the face reads as metal
const fill = new THREE.PointLight(0xdfe8ff, 7, 30); fill.position.set(2.2, -2.4, 3.0); scene.add(fill);
const warm = new THREE.PointLight(0xffb060, 34, 30); warm.position.set(-3.4, 1.0, 0.9); scene.add(warm);
const warm2 = new THREE.PointLight(0xffa040, 26, 30); warm2.position.set(0.2, 3.0, -0.6); scene.add(warm2);
ren.render(scene, cam);
// soft shadow under the coin and a glint on its rim
add(`<div class="abs" style="left:${CX - 300}px;top:${CY - 300}px;width:600px;height:600px;border-radius:50%;box-shadow:0 0 90px 30px rgba(255,220,150,.28);mix-blend-mode:screen"></div>`);
const star = (x, y, s, o) => `<div class="abs" style="left:${x - s}px;top:${y - s}px;width:${2 * s}px;height:${2 * s}px;opacity:${o};mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(255,244,210,.55) 7%,rgba(255,244,210,0) 30%),linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 100%) 0 50%/100% 4px no-repeat,linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 100%) 50% 0/4px 100% no-repeat"></div>`;
add(star(CX + 150, CY - 206, 150, 1) + star(CX - 196, CY + 118, 70, 0.7));

// 5 — dust in the light
{ const R = rng(23); let h = '';
  for (let i = 0; i < 110; i++) { const a = (R() - 0.5) * 1.0, d = 240 + R() * 1250, x = CX + Math.cos(a) * d, y = CY + Math.sin(a) * d, s = 2 + R() * 7, o = 0.12 + R() * 0.5 * (1 - d / 1700);
    h += `<div class="abs" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;border-radius:50%;background:rgba(255,226,170,${o.toFixed(2)});filter:blur(${(R() * 2.4).toFixed(1)}px)"></div>`; }
  add(h); }

// 6 — text block (right): the question, then the number
add(`<div class="abs" style="left:1040px;top:0;width:880px;height:1080px;background:linear-gradient(90deg,rgba(2,2,3,0) 0%,rgba(2,2,3,.55) 30%,rgba(2,2,3,.78) 100%)"></div>
<div class="abs" id="ar" style="left:1010px;top:-22px;width:880px;text-align:center;font-family:'Amiri Quran','Amiri',serif;direction:rtl;font-size:192px;line-height:1.62;color:#FFF4D4;text-shadow:0 0 34px rgba(255,205,110,.95),0 0 90px rgba(255,170,60,.7),0 6px 16px rgba(0,0,0,.9)">${Q['q']}</div>
<div class="abs" id="l1" style="left:1010px;top:408px;width:880px;text-align:center;white-space:nowrap;font-family:'Anton',sans-serif;font-size:236px;line-height:1;letter-spacing:.012em;color:#fff;text-shadow:0 9px 0 rgba(0,0,0,.6),0 0 46px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.9)"><span>1 GHANTA</span></div>
<div class="abs" id="l2" style="left:1010px;top:652px;width:880px;text-align:center;white-space:nowrap;font-family:'Anton',sans-serif;font-size:236px;line-height:1;letter-spacing:.012em;color:#FFD21E;text-shadow:0 9px 0 rgba(0,0,0,.6),0 0 46px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.9)"><span>41 MINUTE</span></div>
<div class="abs" style="left:1010px;top:916px;width:880px;text-align:center;font-family:'Montserrat',sans-serif;font-weight:900;font-size:66px;letter-spacing:.07em;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.95)">= AAPKI ZINDAGI?</div>
<div class="abs" style="inset:0;box-shadow:inset 0 0 240px rgba(0,0,0,.8)"></div>`);

await document.fonts.ready; await Promise.all(['Anton', 'Montserrat', 'Amiri Quran'].map(f => document.fonts.load(`900 100px "${f}"`, 'A1 ك')));
// fit both number lines to the same column width (860 px) so they stack as one block
for (const id of ['l1', 'l2']) { const d = document.getElementById(id), sp = d.firstChild, k = 860 / sp.getBoundingClientRect().width; d.style.fontSize = (236 * k).toFixed(1) + 'px'; }
{ const a = document.getElementById('l1'), b = document.getElementById('l2'), ha = parseFloat(a.style.fontSize), hb = parseFloat(b.style.fontSize);
  a.style.top = '418px'; b.style.top = (418 + ha * 1.045).toFixed(0) + 'px'; window.geo = { ha, hb }; }
window.ready = true;
</script></body></html>
